name: Vytvorit Kodi Skin Release

on:
  push:
    branches:
      - main # Spustí se automaticky při každém běžném Pushi do větve main
  workflow_dispatch: # Zachová i možnost spustit akci ručně na webu

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu z repozitáře
        uses: actions/checkout@v4

      - name: Kontrola verze v addon.xml
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Načtení ID a verze přímo z tagu <addon> v souboru addon.xml
          ADDON_ID=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().attrib['id'])")
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().attrib['version'])")
          TAG="v${VERSION}"

          echo "addon_id=$ADDON_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Kontrola, zda Release s touto verzí už na GitHubu existuje
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Verze $TAG uz existuje, preskakuji tvorbu ZIPu."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Nova verze $TAG detekovana, pripravuji vydani."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Zabalení skinu do ZIPu pro Kodi
        if: steps.check_version.outputs.exists == 'false'
        run: |
          ADDON_ID="${{ steps.check_version.outputs.addon_id }}"
          VERSION="${{ steps.check_version.outputs.version }}"

          # Vytvoření dočasné složky se správným názvem pro Kodi
          mkdir -p build/$ADDON_ID

          # Kopírování souborů kromě git složek a samotného buildu
          rsync -av --exclude='.git*' --exclude='build' . build/$ADDON_ID/

          # Vytvoření finálního ZIP archivu
          cd build
          zip -r "../${ADDON_ID}-${VERSION}.zip" "$ADDON_ID"
          cd ..

      - name: Vytvoření GitHub Release
        if: steps.check_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: Verze ${{ steps.check_version.outputs.version }}
          files: ${{ steps.check_version.outputs.addon_id }}-${{ steps.check_version.outputs.version }}.zip
          generate_release_notes: true
